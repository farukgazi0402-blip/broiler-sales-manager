name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare Cordova Project
      run: |
        cordova create temp_app com.faruk.broilersalesmanager "Broiler Sales Manager"
        cd temp_app
        rm -rf www/*
        cp -r ../www/* www/
        cp ../config.xml config.xml
        cordova platform add android

    - name: Build Debug APK
      run: |
        cd temp_app
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BroilerSalesManager-debug
        path: temp_app/platforms/android/app/build/outputs/apk/debug/app-debug-apk.apk
